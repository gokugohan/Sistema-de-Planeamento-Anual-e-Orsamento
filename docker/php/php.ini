; PHP settings of the PAA production image
expose_php = Off
memory_limit = 256M
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
date.timezone = Asia/Dili

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; the code never changes inside a running container: a new image is deployed instead
opcache.validate_timestamps = 0
